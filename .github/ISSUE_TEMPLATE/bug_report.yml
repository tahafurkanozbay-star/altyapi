name: Hata bildirimi
description: Harita, katman, servis veya arayüz hatası bildirin.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Hata özeti
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adımları
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: İlgili servis / katman
  - type: dropdown
    id: device
    attributes:
      label: Cihaz sınıfı
      options: [Masaüstü, Dizüstü, Tablet, Telefon]
  - type: input
    id: browser
    attributes:
      label: Tarayıcı ve sürüm
