name: Scale and Extent Verification Temporary

on:
  push:
    branches: [scale-aware-operational-extents]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify infrastructure render behavior across zoom windows
        run: node scripts/probe-render-windows.mjs
