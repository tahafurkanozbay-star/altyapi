name: Scale and Extent Verification Temporary

on:
  push:
    branches: [scale-aware-operational-extents]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify service scale ranges and declared extents
        run: node scripts/probe-scale-extents.mjs
      - name: Verify actual query extents
        run: node scripts/probe-data-extents.mjs
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-extent-reports
          path: |
            scale-extent-report.json
            data-extent-report.json
          if-no-files-found: ignore
