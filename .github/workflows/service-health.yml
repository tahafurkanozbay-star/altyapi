name: Service Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: service-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Probe external services
        run: npm run probe:services
      - name: Validate sanitized snapshot
        run: npm run validate:health
      - name: Audit service scale metadata
        run: npm run audit:scales
      - name: Validate sanitized scale audit
        run: npm run validate:scale-audit
      - name: Write summary
        shell: bash
        run: npm run summary:observability >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized observability snapshots
        uses: actions/upload-artifact@v7
        with:
          name: service-observability-snapshots
          path: |
            public/service-health.json
            service-scale-audit.json
          if-no-files-found: error
          retention-days: 14
