name: Service Zoom Audit Temporary

on:
  push:
    branches: [service-zoom-audit-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Probe every service across zoom levels
        run: node scripts/probe-service-zoom.mjs
      - name: Print sanitized zoom report
        if: always()
        run: |
          if [ -f service-zoom-report.json ]; then
            node -e 'const r=require("./service-zoom-report.json"); console.log(JSON.stringify(r,null,2))'
          fi
      - name: Upload sanitized zoom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-zoom-report
          path: service-zoom-report.json
          if-no-files-found: ignore
