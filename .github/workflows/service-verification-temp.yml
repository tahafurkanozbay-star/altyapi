name: Service Verification Temporary

on:
  push:
    branches: [service-verification-20260918]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Probe all services
        run: node scripts/probe-services.mjs
      - name: Print sanitized report
        if: always()
        run: |
          if [ -f service-probe-report.json ]; then
            node -e 'const r=require("./service-probe-report.json"); console.log(JSON.stringify({checkedAt:r.checkedAt,total:r.total,pass:r.pass,partial:r.partial,fail:r.fail,results:r.results},null,2))'
          fi
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-probe-report
          path: service-probe-report.json
          if-no-files-found: ignore
