name: Service Verification Temporary

on:
  push:
    branches: [service-verification-20260918]

permissions:
  contents: read

jobs:
  probe-fallbacks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Probe protocol and direct-server fallbacks
        run: node scripts/probe-fallbacks.mjs
