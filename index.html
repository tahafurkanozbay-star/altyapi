<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07111c" />
    <meta name="description" content="Başkent 3B CBS · Ankara Altyapı / Üstyapı Koordinasyon ve Operasyon Platformu" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="application-name" content="Başkent 3B CBS" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Başkent 3B CBS · Komuta Merkezi</title>
  </head>
  <body>
    <div id="root">
      <div id="static-boot-fallback" style="min-height:100vh;display:grid;place-items:center;background:#07111c;color:#eef7ff;font:14px/1.6 Inter,system-ui,sans-serif;padding:24px;text-align:center">
        <div><strong style="font-size:18px">Başkent 3B CBS hazırlanıyor…</strong><div style="margin-top:6px;color:#9fb4c8">Komuta merkezi ve yerel ESM 3B harita motoru yükleniyor.</div></div>
      </div>
    </div>
    <noscript>Bu uygulamanın çalışması için JavaScript etkin olmalıdır.</noscript>
    <script>
      window.__ALTYAPI_BOOT_TIMER__ = window.setTimeout(function () {
        if (document.documentElement.dataset.appReady === "true") return;
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#07111c;color:#eef7ff;font:14px/1.65 Inter,system-ui,sans-serif;padding:24px"><div style="max-width:680px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:rgba(255,255,255,.06);padding:26px"><strong style="font-size:20px">Uygulama derlenmeden açılamadı</strong><p style="color:#a9bed0">Bu proje React + TypeScript + Vite kullanır. VS Code Live Server kaynak <code>.tsx</code> dosyalarını derleyemez.</p><p><code>npm install</code><br><code>npm run dev</code></p><p style="color:#a9bed0">Live Server kullanmak zorundaysanız önce <code>npm run build</code> çalıştırın ve <code>dist/</code> çıktısını servis edin.</p></div></div>';
      }, 4500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
